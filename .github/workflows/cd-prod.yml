name: cd-production
on:
  push:
    branches:
      - production
jobs:
  deploy-on-render:
    runs-on: ubuntu-latest
    environment:
      name: "production"
      url: https://pakvista-prod-latest-jfi0.onrender.com
    steps:
      - name: Welcome Step
        run: echo "Deploying On Render"
      - name: Deploying On Render
        run: curl -X POST ${{secrets.RENDER_DEPLOY_HOOK_STAGING_URL}}
      - name: Deployment Success 
        run: echo "Successfully Deployed App On Render"
