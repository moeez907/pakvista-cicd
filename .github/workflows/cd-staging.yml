name: cd-staging
on:
  push:
    branches:
      - staging
jobs:
  deploy-on-render:
    runs-on: ubuntu-latest
    environment:
      name: "staging"
      url: https://api.render.com/deploy/srv-d8sl8t9o3t8c73bgl3kg?key=97L3qnMjvb4
    steps:
      - name: Welcome Step
        run: echo "Deploying On Render"
      - name: Deploying On Render
        run: curl -X POST ${{secrets.RENDER_DEPLOY_HOOK_STAGING_URL}}
      - name: Deployment Success 
        run: echo "Successfully Deployed App On Render"
